services:
  clicklens:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-latest}"
    image: kiennt26/clicklens:latest
    container_name: clicklens
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Localhost-only: allows HTTP cookies in dev
      - DISABLE_SECURE_COOKIES=true
    restart: unless-stopped
    depends_on:
      - clickhouse-alpha
      - clickhouse-beta

  clickhouse-alpha:
    image: clickhouse/clickhouse-server:latest
    user: "101:101"
    container_name: clickhouse-alpha
    hostname: clickhouse-alpha
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./dev/multi-cluster/init-alpha.sh:/docker-entrypoint-initdb.d/init.sh
    restart: unless-stopped

  clickhouse-beta:
    image: clickhouse/clickhouse-server:latest
    user: "101:101"
    container_name: clickhouse-beta
    hostname: clickhouse-beta
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - ./dev/multi-cluster/init-beta.sh:/docker-entrypoint-initdb.d/init.sh
    restart: unless-stopped
